<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: #ffffff; }
#frame { box-sizing: content-box; border: 1px solid #c4c7cc; border-radius: 10px; overflow: hidden; background: #dfe1e5; font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #202124; }
#tabs { display: flex; align-items: flex-end; height: 38px; padding: 0 12px; }
#dots { display: flex; gap: 8px; align-self: center; margin-right: 16px; }
#dots span { display: block; width: 12px; height: 12px; border-radius: 50%; }
#tab { min-width: 0; max-width: 260px; padding: 8px 16px; background: #ffffff; border-radius: 8px 8px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar { padding: 6px 12px; background: #ffffff; border-bottom: 1px solid #dadce0; }
#url { padding: 5px 14px; background: #f1f3f4; border-radius: 14px; color: #3c4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#page { display: block; width: 100%; }
</style>
</head>
<body>
<div id="frame">
<div id="tabs"><div id="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div><div id="tab"></div></div>
<div id="bar"><div id="url"></div></div>
<img id="page" alt="">
</div>
</body>
</html>
